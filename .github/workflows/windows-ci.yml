name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and test
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Java 26
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '26'
          cache: maven

      - name: Set up .NET 10
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'

      - name: Run Java tests
        run: .\mvnw.cmd -B test

      - name: Restore native test project
        run: dotnet restore native\VaultKind.Windows.Tests\VaultKind.Windows.Tests.csproj

      - name: Run native policy tests
        run: dotnet run --project native\VaultKind.Windows.Tests\VaultKind.Windows.Tests.csproj -c Release --no-restore
