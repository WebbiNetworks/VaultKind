howItWorks.assistant.connected.body=Return to Dashboard and select the existing vault entry on the left. Connecting it again would create a duplicate entry; it does not repair or resynchronize the encrypted data.
howItWorks.assistant.busy.title=Close files before locking the vault
howItWorks.assistant.busy.body=An application may still be using a file from the virtual drive. Save your work, close open documents and File Explorer windows using the vault, then try Lock again.
howItWorks.assistant.privacy=This offline guide does not inspect vault contents, passwords, recovery keys, file names, or diagnostic logs.
