diagnostics.browse.title=%s diagnostic cases
diagnostics.browse.hint=Enter any case ID in the search box to open its full guidance.
diagnostics.VK-0001.title=VaultKind settings cannot be loaded
diagnostics.VK-0001.cause=The local settings file may be locked, malformed, or left incomplete after an interrupted write.
diagnostics.VK-0001.checks=1. Confirm another VaultKind process is not running.  2. Verify the settings location is writable.  3. Preserve a copy of the current settings file before changing it.
diagnostics.VK-0001.fix=Close duplicate processes and restart VaultKind. If parsing still fails, restore a known-good settings backup or reset only the damaged preferences.
diagnostics.VK-0002.title=A required desktop component is unavailable
diagnostics.VK-0002.cause=The runtime, a native library, or another packaged dependency may be missing or blocked.
diagnostics.VK-0002.checks=1. Confirm the installation completed.  2. Check whether security software quarantined a VaultKind file.  3. Verify the operating system is supported.
diagnostics.VK-0002.fix=Restore the blocked file only if its VaultKind package signature or source is trusted, then repair or reinstall the application package.
diagnostics.VK-1001.title=The vault password was rejected
diagnostics.VK-1001.cause=The password may be incorrect, entered for a different vault, or affected by keyboard state.
diagnostics.VK-1001.checks=1. Confirm Caps Lock and keyboard layout.  2. Confirm the selected vault name and location.  3. Retry carefully without repeatedly guessing.
diagnostics.VK-1001.fix=Use the correct password. If it has been forgotten, use the saved recovery key; VaultKind cannot reset or reveal the old password.
diagnostics.VK-1002.title=The vault storage folder is unavailable
diagnostics.VK-1002.cause=The folder may have moved, an external device may be disconnected, or cloud synchronization may not have restored it locally.
diagnostics.VK-1002.checks=1. Verify the shown path exists.  2. Reconnect external or network storage.  3. Wait for the cloud folder to finish synchronizing.
diagnostics.VK-1002.fix=Use Add Vault → Add an existing vault and select the folder containing the vault configuration file.
diagnostics.VK-1003.title=The vault configuration is missing or invalid
diagnostics.VK-1003.cause=The configuration file may be absent, incomplete, corrupted, or from an unsupported vault layout.
diagnostics.VK-1003.checks=1. Do not modify encrypted data files.  2. Look for the expected vault configuration and its backups.  3. Confirm the vault version is supported.
diagnostics.VK-1003.fix=Restore the configuration from a trusted backup or use the appropriate recovery workflow. Never replace it with a file from another vault.
diagnostics.VK-1004.title=The vault is already connected
diagnostics.VK-1004.cause=VaultKind already has an entry pointing to the selected vault location.
diagnostics.VK-1004.checks=1. Return to Dashboard.  2. Locate the existing vault entry.  3. Confirm its path matches the folder you selected.
diagnostics.VK-1004.fix=Use the existing entry. Adding it again would create a duplicate and does not repair or resynchronize vault data.
diagnostics.VK-2001.title=The vault location is not writable
diagnostics.VK-2001.cause=Folder permissions, read-only media, security controls, or a disconnected account may be blocking writes.
diagnostics.VK-2001.checks=1. Confirm the drive is not read-only.  2. Test creating a harmless file beside the vault.  3. Check the current account's folder permissions.
diagnostics.VK-2001.fix=Restore write access for the current user or move the encrypted vault to a supported writable location while it is locked.
diagnostics.VK-2002.title=The storage location is full
diagnostics.VK-2002.cause=The encrypted storage, system drive, or temporary-file location may lack enough free space.
diagnostics.VK-2002.checks=1. Check free space on both encrypted storage and the system drive.  2. Check cloud quota.  3. Allow room for synchronization overhead.
diagnostics.VK-2002.fix=Free sufficient space or increase the storage quota, then allow synchronization to finish before retrying.
diagnostics.VK-2003.title=The vault is still in use
diagnostics.VK-2003.cause=An application or File Explorer window may still hold a file handle inside the unlocked virtual drive.
diagnostics.VK-2003.checks=1. Save open work.  2. Close documents and windows using the vault.  3. Pause tools scanning or indexing the unlocked drive.
diagnostics.VK-2003.fix=Close the process using the vault and try Lock again. Avoid forcing removal while writes are active.
diagnostics.VK-2004.title=Cloud synchronization is incomplete or conflicted
diagnostics.VK-2004.cause=The cloud client may be offline, paused, out of quota, or resolving conflicting encrypted files.
diagnostics.VK-2004.checks=1. Keep the vault locked.  2. Confirm the cloud client is online.  3. Resolve quota or conflict warnings.  4. Wait for synchronization to finish.
diagnostics.VK-2004.fix=Retry only after the provider reports synchronization complete. Do not open the same vault on another device during conflict resolution.
diagnostics.VK-2005.title=The virtual drive could not be mounted
diagnostics.VK-2005.cause=The selected mounting backend may be unavailable, misconfigured, or unable to claim the requested drive location.
diagnostics.VK-2005.checks=1. Open Settings → Virtual Drive.  2. Confirm an available mounting service is selected.  3. Check whether the requested drive letter or path is already in use.
diagnostics.VK-2005.fix=Select an available backend or mount location, then lock and unlock the vault again.
diagnostics.VK-3001.title=Access must be restored with a recovery key
diagnostics.VK-3001.cause=The password is no longer known, but a valid recovery key may still restore access.
diagnostics.VK-3001.checks=1. Locate the recovery key stored outside the vault.  2. Confirm it belongs to this vault.  3. Enter every word exactly.
diagnostics.VK-3001.fix=Complete the recovery workflow and choose a new strong password. Store the recovery key securely and never share it.
diagnostics.VK-3002.title=Vault integrity needs verification
diagnostics.VK-3002.cause=Interrupted synchronization, storage failure, or manual changes may have left inconsistent encrypted data.
diagnostics.VK-3002.checks=1. Stop synchronization changes.  2. Preserve a backup of the encrypted vault.  3. Run VaultKind's health check and review each reported item.
diagnostics.VK-3002.fix=Follow only the repair action associated with a verified health-check result. Preserve backups until the vault has been opened and checked successfully.
