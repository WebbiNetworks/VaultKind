howItWorks.intro.title=Your files are encrypted before they reach cloud storage.
howItWorks.intro.description=VaultKind creates an encrypted vault in a folder you choose. That folder can stay on your computer or sync through a cloud service. The readable versions of your files appear only after you unlock the vault.
howItWorks.flow.title=The everyday workflow
howItWorks.step1.title=Choose encrypted storage
howItWorks.step1.description=Pick a local folder or one that is synchronized by your cloud provider.
howItWorks.step2.title=Unlock with VaultKind
howItWorks.step2.description=Your password unlocks the vault on this device. It is never sent to your cloud provider.
howItWorks.step3.title=Work in the virtual drive
howItWorks.step3.description=Open, edit, and save files normally. Lock the vault when you are finished.
howItWorks.twoViews.title=One vault, two different views
howItWorks.twoViews.description=The storage folder and unlocked drive serve different purposes. Add and open your files through the unlocked drive—not inside the encrypted storage folder.
howItWorks.encrypted.title=Encrypted storage folder
howItWorks.encrypted.description=Contains scrambled file names and encrypted data suitable for local or cloud storage.
howItWorks.unlocked.title=Unlocked virtual drive
howItWorks.unlocked.description=Shows the familiar files and folders that only you can read and work with.
howItWorks.recovery.title=Protect your password and recovery key
howItWorks.recovery.description=VaultKind cannot reset your password. A recovery key can restore access, so save it somewhere secure and separate from the vault.
howItWorks.action.dashboard=Back to Dashboard
howItWorks.action.addVault=Add a Vault
howItWorks.create.title=Creating Your First Vault
howItWorks.create.description=VaultKind guides you through four clear steps: name the vault, choose its encrypted storage location, review the details, and protect it with a password.
howItWorks.create.tip=Choose a location that is backed up or synchronized, then save the recovery key somewhere separate from the vault.
howItWorks.recoveryKeys.title=Recovery Keys
howItWorks.recoveryKeys.description=A recovery key can restore access when you forget your password. It cannot be recreated after access is lost.
howItWorks.recoveryKeys.tip=Keep a printed or offline copy in a secure place. Never store the only copy inside the vault it protects.
howItWorks.cloud.title=Cloud Storage
howItWorks.cloud.description=Place the encrypted storage folder inside Dropbox, OneDrive, Google Drive, or another synchronized folder. Your provider receives encrypted data—not your readable files.
howItWorks.cloud.tip=Allow synchronization to finish before shutting down or making changes from another device.
howItWorks.virtualDrives.title=Virtual Drives
howItWorks.virtualDrives.description=After unlocking, VaultKind opens a familiar virtual drive. This is where you read, edit, add, and organize your files.
howItWorks.virtualDrives.tip=Work in the virtual drive, not directly inside the encrypted storage folder. Lock the vault when finished.
howItWorks.security.title=Security Tips
howItWorks.security.description=Use a unique password, protect your recovery key, keep reliable backups, install trusted updates, and lock vaults you are no longer using.
howItWorks.security.tip=VaultKind protects file contents, but device security and safe backups remain important parts of your protection.
howItWorks.faq.title=FAQ
howItWorks.faq.q1=Does VaultKind upload my files?
howItWorks.faq.a1=No. VaultKind encrypts locally. Your existing cloud application handles synchronization if you choose a cloud folder.
howItWorks.faq.q2=Can VaultKind reset my password?
howItWorks.faq.a2=No. Use your recovery key to restore access if you forget the password.
howItWorks.faq.q3=Can I use the same vault on another device?
howItWorks.faq.a3=Yes. Let the encrypted folder synchronize, then add that existing vault on the other device.
