howItWorks.assistant.unlock.title=Start with the password and vault location
howItWorks.assistant.unlock.body=Confirm Caps Lock is off and that you selected the correct vault. If the password is still rejected, use the recovery key workflow—VaultKind cannot reset or reveal a forgotten password.
howItWorks.assistant.missing.title=Check whether the encrypted storage is available
howItWorks.assistant.missing.body=Reconnect the external drive or allow your cloud folder to finish synchronizing. Then use Add Vault → Add an existing vault and select the folder containing the encrypted vault.
howItWorks.assistant.cloud.title=Pause changes until synchronization finishes
howItWorks.assistant.cloud.body=Keep the vault locked while resolving sync conflicts. Confirm the cloud application is running, online, and finished synchronizing before opening the same vault on another device.
howItWorks.assistant.drive.title=Check the vault state and mounting service
howItWorks.assistant.drive.body=Lock the vault, verify that no application is still using its files, and unlock it again. If the drive still does not appear, review Settings → Virtual Drive and confirm the selected mounting service is available.
howItWorks.assistant.recovery.title=Use your recovery key to regain access
howItWorks.assistant.recovery.body=VaultKind cannot reset or reveal a forgotten password. Start the recovery-key workflow, enter the words exactly as saved, and then choose a new password. Never share the recovery key or store it inside the vault it protects.
howItWorks.assistant.mountError.title=The selected mounting service is unavailable
howItWorks.assistant.mountError.body=Error BTS9:KT9R:KT9R or “No value present” usually means VaultKind could not prepare the virtual drive. Open Settings → Virtual Drive, select an available mounting service, then lock and unlock the vault again.
